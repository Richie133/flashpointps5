# Builds the app on every push, and puts PPSA72386.zip (what homebrew stores
# install) on releases:
#   - Publish a release on GitHub with any tag: the zip is attached a few
#     minutes later, and its sha256 is added under your notes.
#   - Actions > Build > Run workflow, with "Release tag" filled in: builds it
#     and attaches the zip to that release, creating the release (from the
#     chosen branch) if it doesn't exist yet; a tag with alpha, beta or rc in
#     it becomes a pre-release.
#   - Run workflow with "Publish a new release" ticked: creates the release
#     v<contentVersion> from sce_sys/param.json.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.0.3-alpha (created if new; empty only builds)
        type: string
        default: ''
      publish:
        description: Or publish a new release v<contentVersion> from sce_sys/param.json
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check out an existing release tag
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # an existing tag is rebuilt as it was; a new one is made from this branch
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then git checkout -q "refs/tags/$TAG"; fi

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make ninja-build python3 unzip zip curl \
            clang-18 lld-18 llvm-18 libclang-rt-18-dev libc++-18-dev libc++abi-18-dev
          for tool in clang clang++ ld.lld llvm-ar llvm-ranlib; do
            sudo ln -sf "/usr/bin/$tool-18" "/usr/local/bin/$tool"
          done

      - name: Decide what to publish
        id: target
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("sce_sys/param.json"))["contentVersion"])')
          echo "contentVersion: $version"
          mode=none
          tag=
          if [[ $GITHUB_EVENT_NAME == release ]]; then
            mode=attach; tag=$GITHUB_REF_NAME
          elif [[ $GITHUB_EVENT_NAME == workflow_dispatch && -n $INPUT_TAG ]]; then
            mode=attach; tag=$INPUT_TAG
          elif [[ $GITHUB_EVENT_NAME == workflow_dispatch && $INPUT_PUBLISH == true ]]; then
            IFS=. read -r major minor patch <<< "$version"
            mode=create; tag="v$((10#$major)).$((10#$minor)).$((10#$patch))"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish: $mode $tag"

      - name: Build
        run: make USE_CCACHE=0

      - uses: actions/upload-artifact@v6
        with:
          name: PPSA72386
          path: dist/PPSA72386.zip

      - name: Publish
        if: steps.target.outputs.mode != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.target.outputs.mode }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          sha=$(sha256sum dist/PPSA72386.zip | cut -d ' ' -f 1)
          line="\`PPSA72386.zip\` sha256: \`$sha\`"
          if [[ $MODE == attach ]] && ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # a new release: from this commit, a pre-release for alpha/beta/rc tags
            pre=()
            shopt -s nocasematch
            [[ $TAG == *alpha* || $TAG == *beta* || $TAG == *rc* ]] && pre=(--prerelease)
            { cat .github/release-notes.md; printf '\n%s\n' "$line"; } > notes.md
            gh release create "$TAG" dist/PPSA72386.zip --repo "$GITHUB_REPOSITORY" "${pre[@]}" \
              --target "$GITHUB_SHA" --title "Flashpoint PS5 ${TAG#v}" --notes-file notes.md
          elif [[ $MODE == attach ]]; then
            gh release upload "$TAG" dist/PPSA72386.zip --clobber --repo "$GITHUB_REPOSITORY"
            # keep the release's own title and notes; replace an older digest line
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > body.md
            python3 - "$line" <<'PY'
          import sys
          kept = [l for l in open("body.md").read().splitlines()
                  if not l.startswith("`PPSA72386.zip` sha256:")]
          text = "\n".join(kept).rstrip()
          open("notes.md", "w").write((text + "\n\n" if text else "") + sys.argv[1] + "\n")
          PY
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            { cat .github/release-notes.md; printf '\n%s\n' "$line"; } > notes.md
            gh release create "$TAG" dist/PPSA72386.zip --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Flashpoint PS5 ${TAG#v}" --notes-file notes.md
          fi
          echo "$line"
