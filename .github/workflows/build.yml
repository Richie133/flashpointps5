# Builds the app on every push. A tag such as v1.0.0 also publishes a GitHub
# release with PPSA72386.zip attached (what homebrew stores install).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make ninja-build python3 unzip zip curl \
            clang-18 lld-18 llvm-18 libclang-rt-18-dev libc++-18-dev libc++abi-18-dev
          for tool in clang clang++ ld.lld llvm-ar llvm-ranlib; do
            sudo ln -sf "/usr/bin/$tool-18" "/usr/local/bin/$tool"
          done

      - name: Check the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c 'import json; print(json.load(open("sce_sys/param.json"))["contentVersion"])')
          IFS=. read -r major minor patch <<< "$version"
          expected="v$((10#$major)).$((10#$minor)).$((10#$patch))"
          [[ $GITHUB_REF_NAME == "$expected" ]] || {
            echo "tag $GITHUB_REF_NAME does not match contentVersion $version ($expected)" >&2
            exit 1
          }

      - name: Build
        run: make USE_CCACHE=0

      - uses: actions/upload-artifact@v4
        with:
          name: PPSA72386
          path: dist/PPSA72386.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(sha256sum dist/PPSA72386.zip | cut -d ' ' -f 1)
          { cat .github/release-notes.md; printf '\n`PPSA72386.zip` sha256: `%s`\n' "$sha"; } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/PPSA72386.zip \
            --title "Flashpoint PS5 ${GITHUB_REF_NAME#v}" --notes-file notes.md
