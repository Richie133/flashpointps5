# Builds the app on every push. Publishing a release attaches PPSA72386.zip
# to it (what homebrew stores install):
#   - Actions > Build > Run workflow with "Publish a release" ticked creates
#     the release v<contentVersion> from sce_sys/param.json, or
#   - a release published on GitHub (tag v<contentVersion>) gets the zip,
#     title and notes added a few minutes later.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release for the version in sce_sys/param.json
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make ninja-build python3 unzip zip curl \
            clang-18 lld-18 llvm-18 libclang-rt-18-dev libc++-18-dev libc++abi-18-dev
          for tool in clang clang++ ld.lld llvm-ar llvm-ranlib; do
            sudo ln -sf "/usr/bin/$tool-18" "/usr/local/bin/$tool"
          done

      - name: Work out the release tag
        id: version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("sce_sys/param.json"))["contentVersion"])')
          IFS=. read -r major minor patch <<< "$version"
          tag="v$((10#$major)).$((10#$minor)).$((10#$patch))"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ $GITHUB_EVENT_NAME == release && $GITHUB_REF_NAME != "$tag" ]]; then
            echo "release $GITHUB_REF_NAME does not match contentVersion $version (expected $tag)" >&2
            exit 1
          fi

      - name: Build
        run: make USE_CCACHE=0

      - uses: actions/upload-artifact@v4
        with:
          name: PPSA72386
          path: dist/PPSA72386.zip

      - name: Publish the release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          sha=$(sha256sum dist/PPSA72386.zip | cut -d ' ' -f 1)
          { cat .github/release-notes.md; printf '\n`PPSA72386.zip` sha256: `%s`\n' "$sha"; } > notes.md
          title="Flashpoint PS5 ${TAG#v}"
          if [[ $GITHUB_EVENT_NAME == release ]]; then
            gh release upload "$TAG" dist/PPSA72386.zip --clobber
            gh release edit "$TAG" --title "$title" --notes-file notes.md
          else
            gh release create "$TAG" dist/PPSA72386.zip --target "$GITHUB_SHA" \
              --title "$title" --notes-file notes.md
          fi
